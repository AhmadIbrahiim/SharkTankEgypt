name: Read pitch videos via the Wayback Machine
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: timeout 25m node scripts/fetch-wayback.mjs automation/sources/wayback-targets.json automation/sources/wayback-out.json
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add automation/sources/wayback-out.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: pitch-video titles and descriptions from the Wayback Machine"
          git pull -q --rebase origin main && git push origin HEAD:main

name: Collect people photos
# Candidate portraits (og:image of each cited page) to `automation/photos/` on main for review.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/people-photos.mjs /tmp/photos
      - name: Commit to main
        # Raw output for review under automation/; the site never reads it, so no redeploy.
        run: |
          rm -rf automation/photos && mkdir -p automation/photos && cp -r /tmp/photos/. automation/photos/
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add automation/photos
          git diff --cached --quiet && exit 0
          git commit -qm "chore: photos output"
          git pull -q --rebase origin main && git push origin HEAD:main

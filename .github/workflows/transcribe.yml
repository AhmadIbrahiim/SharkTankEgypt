name: Transcribe official TikTok clips
on: workflow_dispatch
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "yt-dlp[default,curl-cffi]" faster-whisper "av>=14"
      - run: timeout 80m python3 scripts/transcribe.py automation/sources/transcribe-targets.json automation/sources/transcripts-${{ matrix.shard }}.json ${{ matrix.shard }} 4
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add automation/sources/transcripts-${{ matrix.shard }}.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: clip transcripts (shard ${{ matrix.shard }})"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push origin HEAD:main && break; sleep $((i*5)); done

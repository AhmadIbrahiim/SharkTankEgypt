name: Fetch source articles
# Saves the text of the articles cited for startups with an unknown pitch outcome to
# `automation/sources/` on main, for review. The site never reads it.
on:
  workflow_dispatch:
    inputs:
      leads_only:
        description: Only fetch automation/sources/leads.json (fast)
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-sources.mjs ${{ inputs.leads_only && '/tmp/leads-out.json --leads' || '/tmp/sources.json' }}
      - if: ${{ !inputs.leads_only }}
        run: node scripts/fetch-clips.mjs /tmp/clips.json || echo '[]' > /tmp/clips.json
      - name: Commit to main
        run: |
          mkdir -p automation/sources && { [ -f /tmp/leads-out.json ] && cp /tmp/leads-out.json automation/sources/leads-out.json || cp /tmp/sources.json automation/sources/sources.json; }; [ -f /tmp/clips.json ] && cp /tmp/clips.json automation/sources/clips.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add automation/sources
          git diff --cached --quiet && exit 0
          git commit -qm "chore: source articles for unknown outcomes"
          git pull -q --rebase origin main && git push origin HEAD:main

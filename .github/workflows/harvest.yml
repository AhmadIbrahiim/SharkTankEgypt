name: Harvest source pages
# Opens each startup's pitch video, website and Instagram and saves what they say to
# `automation/harvest/` on main. The site never reads it; data is reviewed before it reaches src/data.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/harvest.mjs --test
      - run: node scripts/harvest.mjs /tmp/harvest.json
      - name: Commit to main
        # Raw output for review under automation/; the site never reads it, so no redeploy.
        run: |
          rm -rf automation/harvest && mkdir -p automation/harvest && cp -r /tmp/harvest.json automation/harvest/
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add automation/harvest
          git diff --cached --quiet && exit 0
          git commit -qm "chore: harvest output"
          git pull -q --rebase origin main && git push origin HEAD:main

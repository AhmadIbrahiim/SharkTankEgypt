name: Index show clips
# Saves the title, description and date of every official clip reposted on sharktankarabi.com
# to `automation/sources/clips.json` on main, for reviewing pitch outcomes. The site never reads it.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-clips.mjs /tmp/clips.json
      - name: Commit to main
        run: |
          mkdir -p automation/sources && cp /tmp/clips.json automation/sources/clips.json
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add automation/sources
          git diff --cached --quiet && exit 0
          git commit -qm "chore: index show clips"
          git pull -q --rebase origin main && git push origin HEAD:main

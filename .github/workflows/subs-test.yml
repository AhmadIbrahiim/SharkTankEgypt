name: Caption access test
# Probe which method can download YouTube captions from Actions (diagnostic, writes nothing).
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q -U yt-dlp youtube-transcript-api
      - name: yt-dlp (default, then alternative clients)
        run: |
          for c in default "youtube:player_client=web_embedded" "youtube:player_client=tv" "youtube:player_client=ios" "youtube:player_client=mweb"; do
            echo "== $c"
            if [ "$c" = default ]; then A=""; else A="--extractor-args $c"; fi
            yt-dlp $A --skip-download --write-auto-subs --sub-langs "ar.*,ar" --sub-format vtt -o "/tmp/t_%(id)s" "https://www.youtube.com/watch?v=Sid8lwO-2LQ" 2>&1 | tail -4
            ls /tmp/t_* 2>/dev/null && head -c 600 /tmp/t_*.vtt && rm -f /tmp/t_*
          done
      - name: youtube-transcript-api
        run: |
          python - <<'PY'
          from youtube_transcript_api import YouTubeTranscriptApi as Y
          for v in ["Sid8lwO-2LQ","TjHaV1gftAY"]:
              try:
                  t = Y().fetch(v, languages=["ar"])
                  print(v, "OK", " ".join(s.text for s in t)[:500])
              except Exception as e:
                  print(v, "ERR", type(e).__name__, str(e)[:300])
          PY
      - name: Piped / Invidious
        run: |
          for u in "https://pipedapi.kavin.rocks/streams/Sid8lwO-2LQ" "https://inv.nadeko.net/api/v1/captions/Sid8lwO-2LQ"; do
            echo "== $u"; curl -s -m 20 "$u" | head -c 400; echo
          done

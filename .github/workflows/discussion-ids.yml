name: Discussion category ids (one-off)
on: workflow_dispatch
permissions:
  discussions: read
jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - run: gh api graphql -f query='query { repository(owner:"AhmadIbrahiim", name:"SharkTankEgypt") { id discussionCategories(first:20) { nodes { id name isAnswerable } } } }'
        env:
          GH_TOKEN: ${{ github.token }}

name: Draft profiles with GitHub Models
# Free LLM drafting for public repos: reads each startup's own pages and drafts services, overview,
# pitch summary, highlights and Arabic founder names, grounded only in that text. Results land in
# `automation/enrich/` on main for review — the site only uses what is copied into src/data.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Max startups this run (free tier ≈150 requests/day)
        default: '140'
  schedule:
    - cron: '23 4 * * 3' # weekly, Wednesday after the episode airs
permissions:
  contents: write
  models: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/enrich.mjs --test
      - run: node scripts/enrich.mjs /tmp/enrich.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit || '140' }}
      - name: Commit to main
        # Raw output for review under automation/; the site never reads it, so no redeploy.
        run: |
          rm -rf automation/enrich && mkdir -p automation/enrich && cp -r /tmp/enrich.json automation/enrich/
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add automation/enrich
          git diff --cached --quiet && exit 0
          git commit -qm "chore: enrich output"
          git pull -q --rebase origin main && git push origin HEAD:main

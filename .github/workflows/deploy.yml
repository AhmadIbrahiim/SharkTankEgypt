name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check-data
      # Prose vs deal-field contradictions, impossible figures, shark not on the season lineup: fail the build.
      - run: npm run audit-data
      - run: npm run build
      # Broken internal links, missing/duplicate titles, canonical and hreflang errors, sitemap gaps: fail the build.
      - run: npm run audit-seo
      # A share image per page (dist/og/…), referenced by each page's og:image.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/og.mjs
      # Publish to the gh-pages branch (Settings → Pages → Deploy from branch: gh-pages).
      # .nojekyll stops GitHub's Jekyll step from dropping Astro's _astro/ folder.
      - if: github.event_name != 'pull_request'
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      # Tell Bing (which also feeds ChatGPT search), Yandex and others that pages changed (IndexNow). The key file is public/8ee7d5496a4b6b2d597639e58b275fa1.txt.
      - if: github.event_name == 'push'
        run: |
          sleep 90 # let Pages publish first
          root=$(node -p "require('./package.json').homepage.replace(/\/?$/, '/')"); host=$(node -p "new URL('$root').host")
          urls=$(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' | head -9000 | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin]))")
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$host\",\"key\":\"8ee7d5496a4b6b2d597639e58b275fa1\",\"keyLocation\":\"${root}8ee7d5496a4b6b2d597639e58b275fa1.txt\",\"urlList\":$urls}" || true

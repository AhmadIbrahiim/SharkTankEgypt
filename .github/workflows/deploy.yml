name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check-data
      - run: npm run build
      # A share image per page (dist/og/…), referenced by each page's og:image.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/og.mjs
      # Publish to the gh-pages branch (Settings → Pages → Deploy from branch: gh-pages).
      # .nojekyll stops GitHub's Jekyll step from dropping Astro's _astro/ folder.
      - if: github.event_name != 'pull_request'
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

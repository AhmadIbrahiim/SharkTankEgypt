name: Read the official site
on:
  workflow_dispatch:
    inputs:
      categories: { description: "Comma-separated deal categories (empty = all)", type: string, default: "" }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: timeout 40m node scripts/probe-site.mjs automation/sources/site.json ${{ inputs.categories }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add automation/sources/site.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: official site snapshot"
          git pull -q --rebase origin main && git push origin HEAD:main

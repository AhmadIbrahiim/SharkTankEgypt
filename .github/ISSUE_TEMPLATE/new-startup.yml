name: "🦈 Add or correct a startup · أضف شركة أو صحّح معلومة"
description: "Suggest a missing startup or correct an existing profile · اقترح شركة ناقصة أو صحّح معلومة في صفحة شركة"
title: "[Startup] "
labels: ["new-startup"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us which company and what is missing or incorrect.
        اذكر اسم الشركة واشرح المعلومات الناقصة أو غير الصحيحة.
  - type: input
    id: name_en
    attributes:
      label: "Company name · اسم الشركة"
      description: "English or Arabic · بالعربية أو الإنجليزية"
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: "Company or profile link · رابط الشركة أو صفحتها"
      description: "Optional · اختياري"
      placeholder: "https://"
  - type: textarea
    id: update_details
    attributes:
      label: "What is wrong or missing? · ما الخطأ أو المعلومة الناقصة؟"
      description: "Explain what we should add or change. Include a source link if you have one. · اشرح ما الذي ينبغي إضافته أو تصحيحه. أضف رابطًا للمصدر إن وجد."
    validations:
      required: true

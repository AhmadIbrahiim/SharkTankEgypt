name: "🦈 Suggest a missing startup · اقترح شركة ناقصة"
description: "A startup that pitched on Shark Tank Egypt but isn't in the directory · شركة ظهرت في شارك تانك مصر وغير موجودة في الدليل"
title: "[Startup] "
labels: ["new-startup"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping complete the directory! Fill in what you know; leave the rest empty.
        شكرًا لمساعدتك في إكمال الدليل! اكتب ما تعرفه واترك الباقي فارغًا.
  - type: input
    id: name_en
    attributes:
      label: "Name (English) · الاسم بالإنجليزية"
    validations:
      required: true
  - type: input
    id: name_ar
    attributes:
      label: "Name (Arabic) · الاسم بالعربية"
  - type: dropdown
    id: season
    attributes:
      label: "Season · الموسم"
      options: ["Season 1 (2023)", "Season 2 (2023–24)", "Season 3 (2024–25)", "Specials (Jul 2025)", "Season 4 (2025–26)", "Season 5 (2026)", "Not sure · مش متأكد"]
    validations:
      required: true
  - type: input
    id: episode
    attributes:
      label: "Episode number · رقم الحلقة"
  - type: textarea
    id: description
    attributes:
      label: "What does it do? · ماذا تقدم الشركة؟"
      description: "1–3 sentences · جملة إلى ثلاث جمل"
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: "Website or Instagram · الموقع أو إنستجرام"
      placeholder: "https://"
  - type: dropdown
    id: deal
    attributes:
      label: "Outcome · النتيجة"
      options: ["Deal · تمت الصفقة", "No deal · بدون صفقة", "Not sure · مش متأكد"]
  - type: input
    id: terms
    attributes:
      label: "Ask and deal terms · الطلب والصفقة"
      placeholder: "Asked 2M EGP for 10%, got 2M for 25% from Ayman Abbas"
  - type: textarea
    id: sources
    attributes:
      label: "Source links · روابط المصادر"
      description: "Article, YouTube episode, or post that confirms it · مقال أو حلقة يوتيوب أو منشور يؤكد المعلومة"
